# API Gateway configuration for AI Studio
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Logging format
    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream: $upstream_addr '
                      'request_time=$request_time';

    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    # Upstreams for the 4 microservices
    upstream e1_data {
        server e1-data-service:8001;
    }
    upstream e2_training {
        server e2-training-service:8002;
    }
    upstream e3_assistant {
        server e3-assistant-service:8003;
    }
    upstream e4_studio {
        server e4-studio-service:8004;
    }

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 100M;

        # CORS headers configuration
        set $cors_origin "";
        if ($http_origin ~* (http://localhost:5173|http://localhost:8080|http://127.0.0.1:5173|http://127.0.0.1:8080)) {
            set $cors_origin $http_origin;
        }

        # Global Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gateway health check
        location = /health/live {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway","timestamp":"$time_iso8601"}';
        }

        # Proxied health checks to microservices
        location = /health/e1 {
            proxy_pass http://e1_data/health/live;
        }
        location = /health/e2 {
            proxy_pass http://e2_training/health/live;
        }
        location = /health/e3 {
            proxy_pass http://e3_assistant/health/live;
        }
        location = /health/e4 {
            proxy_pass http://e4_studio/health/live;
        }

        # ---------------------------------------------------------
        # E1 Data Intelligence routes
        # (/auth, /projects, /datasets, /preprocessing, /splits)
        # ---------------------------------------------------------
        location ~ ^/(auth|projects|datasets|preprocessing|splits) {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://e1_data;
        }

        # ---------------------------------------------------------
        # E2 Model Training routes
        # (/models, /training, /tuning, /experiments, /inference)
        # ---------------------------------------------------------
        location ~ ^/(models|training|tuning|experiments|inference) {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://e2_training;
        }

        # ---------------------------------------------------------
        # E3 Agentic AI Assistant routes
        # (/assistant, /policy)
        # ---------------------------------------------------------
        location ~ ^/(assistant|policy) {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://e3_assistant;
        }

        # ---------------------------------------------------------
        # E4 Workflow Studio & MLOps routes
        # (/catalog, /workflows, /executions, /approvals, /exports, /registry)
        # ---------------------------------------------------------
        # SSE Events endpoint requires buffering off
        location ~ ^/executions/.+/events$ {
            proxy_pass http://e4_studio;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;

            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'text/event-stream' always;
        }

        location ~ ^/(catalog|workflows|executions|approvals|exports|registry) {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://e4_studio;
        }

        # Default fallback
        location / {
            default_type application/json;
            return 404 '{"code":"NOT_FOUND","message":"API Gateway: Endpoint not matched to any microservice"}';
        }
    }
}
