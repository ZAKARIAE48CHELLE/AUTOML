# API Gateway configuration for AI Studio
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Suppress upstream CORS headers to avoid duplicate header errors in browsers
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;

    # Logging format
    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream: $upstream_addr '
                      'request_time=$request_time';

    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    # CORS: reflect local development origins only (ports 5173, 8080, 8081, ...)
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
    }

    # Browser page loads (address bar, refresh, links) send "Accept: text/html".
    # API calls from the web client (fetch: "*/*" or JSON, EventSource: "text/event-stream") do not.
    # Several UI routes share a prefix with the API (/projects, /training, /assistant...), so page
    # loads on those paths must be served by the frontend instead of being proxied to a service.
    map "$request_method:$http_accept" $is_page_load {
        default 0;
        "~^(GET|HEAD):.*text/html" 1;
    }

    # Upstreams for the 4 microservices + web
    upstream e1_data {
        server e1-data-service:8001;
    }
    upstream e2_training {
        server e2-training-service:8002;
    }
    upstream e3_assistant {
        server e3-assistant-service:8003;
    }
    upstream e4_studio {
        server e4-studio-service:8004;
    }
    upstream web_app {
        server web:80;
    }

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 100M;

        # Global Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gateway health check
        location = /health/live {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway","timestamp":"$time_iso8601"}';
        }

        # Proxied health checks to microservices
        location = /health/e1 {
            proxy_pass http://e1_data/health/live;
        }
        location = /health/e2 {
            proxy_pass http://e2_training/health/live;
        }
        location = /health/e3 {
            proxy_pass http://e3_assistant/health/live;
        }
        location = /health/e4 {
            proxy_pass http://e4_studio/health/live;
        }

        # SPA entry point for page loads that hit an API-prefixed path (internal only).
        location = /__spa_index {
            internal;
            proxy_pass http://web_app/index.html;
        }

        # ---------------------------------------------------------
        # E1 Data Intelligence routes
        # (/auth, /projects, /datasets, /preprocessing, /splits)
        # ---------------------------------------------------------
        location ~ ^/(auth|projects|datasets|preprocessing|splits)(/|$) {
            if ($is_page_load) {
                rewrite ^ /__spa_index last;
            }
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            proxy_pass http://e1_data;
        }

        # ---------------------------------------------------------
        # E2 Model Training routes
        # (/models, /training, /tuning, /experiments, /inference)
        # ---------------------------------------------------------
        location ~ ^/(models|training|tuning|experiments|inference)(/|$) {
            if ($is_page_load) {
                rewrite ^ /__spa_index last;
            }
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            proxy_pass http://e2_training;
        }

        # ---------------------------------------------------------
        # E3 Agentic AI Assistant routes
        # (/assistant, /policy)
        # ---------------------------------------------------------
        location ~ ^/(assistant|policy)(/|$) {
            if ($is_page_load) {
                rewrite ^ /__spa_index last;
            }
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            proxy_pass http://e3_assistant;
        }

        # ---------------------------------------------------------
        # E4 Workflow Studio & MLOps routes
        # (/catalog, /workflows, /executions, /approvals, /exports, /registry)
        # ---------------------------------------------------------
        # SSE Events endpoint requires buffering off (EventSource sends Accept: text/event-stream)
        location ~ ^/executions/[^/]+/events$ {
            proxy_pass http://e4_studio;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;

            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location ~ ^/(catalog|workflows|executions|approvals|exports|registry)(/|$) {
            if ($is_page_load) {
                rewrite ^ /__spa_index last;
            }
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            proxy_pass http://e4_studio;
        }

        # Frontend Web Application (Serves UI on http://localhost:8080)
        location / {
            proxy_pass http://web_app;
        }
    }
}
