# AI Studio — Microservices Orchestration
name: ai-studio

services:
  # -------------------------------------------------------------
  # PostgreSQL 16 (Multi-database persistence for E1, E2, E3, E4)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------
  # API Gateway (Nginx Reverse Proxy on port 8080)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "8080:8080"
    # Start routing only once every upstream answers its health check.
    depends_on:
      e1-data-service:
        condition: service_healthy
      e2-training-service:
        condition: service_healthy
      e3-assistant-service:
        condition: service_healthy
      e4-studio-service:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # -------------------------------------------------------------
  # E1: Data Intelligence Service
  # -------------------------------------------------------------
  e1-data-service:
    build:
      context: ./services/e1-data-service
    ports:
      - "8001:8001"
    volumes:
      - ./packages/contracts:/contracts:ro  # catalogue partagé (types de pipeline, modèles, métriques)
    environment:
      - CONTRACTS_DIR=/contracts
      - PORT=8001
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # -------------------------------------------------------------
  # E2: Model Training Service
  # -------------------------------------------------------------
  e2-training-service:
    build:
      context: ./services/e2-training-service
    ports:
      - "8002:8002"
    volumes:
      - ./packages/contracts:/contracts:ro  # catalogue partagé (types de pipeline, modèles, métriques)
    environment:
      - CONTRACTS_DIR=/contracts
      - PORT=8002
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # -------------------------------------------------------------
  # E3: Agentic AI Assistant Service
  # -------------------------------------------------------------
  e3-assistant-service:
    build:
      context: ./services/e3-assistant-service
    ports:
      - "8003:8003"
    volumes:
      - ./packages/contracts:/contracts:ro  # catalogue partagé (types de pipeline, modèles, métriques)
    environment:
      - CONTRACTS_DIR=/contracts
      - E4_SERVICE_URL=http://e4-studio-service:8004
      - E1_SERVICE_URL=http://e1-data-service:8001
      - PORT=8003
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # -------------------------------------------------------------
  # E4: Visual Workflow Studio & MLOps Service
  # -------------------------------------------------------------
  e4-studio-service:
    build:
      context: ./services/e4-studio-service
    ports:
      - "8004:8004"
    volumes:
      - ./packages/contracts:/contracts:ro  # catalogue partagé (types de pipeline, modèles, métriques)
    environment:
      - CONTRACTS_DIR=/contracts
      - E1_SERVICE_URL=http://e1-data-service:8001
      - PORT=8004
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e4
      # Governance mode (E3) and model registry (E2) lookups
      - E2_SERVICE_URL=http://e2-training-service:8002
      - E3_SERVICE_URL=http://e3-assistant-service:8003
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # -------------------------------------------------------------
  # Frontend Web Client (Production Nginx on port 8081)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      args:
        VITE_MOCK_MODULES: ${VITE_MOCK_MODULES:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "8081:80"
    # Faster than the Dockerfile's 30s default so the gateway does not wait on the first probe.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------
  # Frontend Web Client (Dev Hot-Reload on port 5173)
  # -------------------------------------------------------------
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      VITE_MOCK_MODULES: ${VITE_MOCK_MODULES:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules

  # -------------------------------------------------------------
  # pgAdmin 4 (Full PostgreSQL IDE on port 5055)
  # -------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aistudio.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5055:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # Adminer (Instant Web Database Manager on port 8085)
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
