# AI Studio — Microservices Orchestration
name: ai-studio

services:
  # -------------------------------------------------------------
  # PostgreSQL 16 (Multi-database persistence for E1, E2, E3, E4)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------
  # API Gateway (Nginx Reverse Proxy on port 8080)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - e1-data-service
      - e2-training-service
      - e3-assistant-service
      - e4-studio-service
    restart: unless-stopped

  # -------------------------------------------------------------
  # E1: Data Intelligence Service
  # -------------------------------------------------------------
  e1-data-service:
    build:
      context: ./services/e1-data-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # E2: Model Training Service
  # -------------------------------------------------------------
  e2-training-service:
    build:
      context: ./services/e2-training-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # E3: Agentic AI Assistant Service
  # -------------------------------------------------------------
  e3-assistant-service:
    build:
      context: ./services/e3-assistant-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # E4: Visual Workflow Studio & MLOps Service
  # -------------------------------------------------------------
  e4-studio-service:
    build:
      context: ./services/e4-studio-service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_studio_e4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # Frontend Web Client (Production Nginx on port 8081)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      args:
        VITE_MOCK_MODULES: ${VITE_MOCK_MODULES:-data,training,assistant,studio}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "8081:80"
    restart: unless-stopped

  # -------------------------------------------------------------
  # Frontend Web Client (Dev Hot-Reload on port 5173)
  # -------------------------------------------------------------
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      VITE_MOCK_MODULES: ${VITE_MOCK_MODULES:-data,training,assistant,studio}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules

  # -------------------------------------------------------------
  # pgAdmin 4 (Full PostgreSQL IDE on port 5055)
  # -------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aistudio.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5055:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # Adminer (Instant Web Database Manager on port 8085)
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
